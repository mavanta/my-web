<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>T ♥</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            #241b42 0%,
            #100c22 45%,
            #05040d 100%
        );

    font-family: Arial, sans-serif;
}

/* =========================
   BACKGROUND
========================= */

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 18px #ff8fd0;

    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {

    0%,
    100% {
        opacity: .15;
        transform: scale(.6);
    }

    50% {
        opacity: 1;
        transform: scale(1.4);
    }
}

/* =========================
   STAGE
========================= */

.stage {
    position: relative;

    width: min(90vw, 90vh);
    height: min(90vw, 90vh);

    max-width: 700px;
    max-height: 700px;
}

/* =========================
   BUTTON
========================= */

.start {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 18px 45px;

    border-radius: 999px;

    border: 1px solid rgba(255, 180, 225, .8);

    background: rgba(255, 120, 190, .12);

    color: white;

    font-size: clamp(18px, 4vw, 26px);

    letter-spacing: 2px;

    cursor: pointer;

    backdrop-filter: blur(10px);

    box-shadow:
        0 0 25px rgba(255, 100, 190, .3),
        inset 0 0 20px rgba(255, 150, 220, .08);

    transition:
        transform .3s,
        box-shadow .3s,
        opacity .8s;
}

.start:hover {

    transform:
        translate(-50%, -50%)
        scale(1.06);

    box-shadow:
        0 0 45px rgba(255, 100, 200, .65);
}

.start.hide {

    animation: buttonDisappear 1s forwards;
}

@keyframes buttonDisappear {

    0% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {
        opacity: .7;
        transform:
            translate(-50%, -50%)
            scale(1.25);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.15);
    }
}

/* =========================
   T
========================= */

.letter {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.2);

    opacity: 0;

    z-index: 10;

    font-size: clamp(120px, 28vw, 190px);

    font-weight: 300;

    color: white;

    text-shadow:
        0 0 15px #fff,
        0 0 40px #ff8bc9,
        0 0 90px #9b6cff;

    transition:
        opacity 1s,
        transform 1.1s cubic-bezier(.2, 1.5, .3, 1);
}

.letter.show {

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}

.letter.float {

    animation: floatT 4s infinite ease-in-out;
}

@keyframes floatT {

    0%,
    100% {
        margin-top: 0;
    }

    50% {
        margin-top: -8px;
    }
}

/* =========================
   SVG
========================= */

svg {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: visible;
}

/* =========================
   RIBBONS
========================= */

.ribbon {

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;

    opacity: 0;

    filter:
        drop-shadow(0 0 7px #ff7fc5)
        drop-shadow(0 0 20px #a66cff);
}

.left {

    stroke: #ff7fbd;

    stroke-width: 8;
}

.right {

    stroke: #b17cff;

    stroke-width: 8;
}

/* =========================
   HEART GLOW
========================= */

.heartGlow {

    fill: none;

    stroke: white;

    stroke-width: 2;

    opacity: 0;

    filter:
        drop-shadow(0 0 10px #ff7fc5)
        drop-shadow(0 0 30px #a66cff);
}

/* =========================
   PARTICLES
========================= */

.particle {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px #ff9ed5,
        0 0 18px #b58aff;

    pointer-events: none;

    opacity: 0;
}

/* =========================
   FINAL HEART ANIMATION
========================= */

.heartDone {

    animation:
        heartBreath 3s infinite ease-in-out;
}

@keyframes heartBreath {

    0%,
    100% {
        filter:
            drop-shadow(0 0 8px #ff6fb5)
            drop-shadow(0 0 20px #8c63ff);
    }

    50% {
        filter:
            drop-shadow(0 0 20px #ff6fb5)
            drop-shadow(0 0 45px #a477ff);
    }
}

/* mobile */

@media(max-width:500px) {

    .left,
    .right {
        stroke-width: 6;
    }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="stage">

    <button class="start" id="start">
        Bấm vào đây
    </button>

    <div class="letter" id="letter">
        T
    </div>

    <svg
        viewBox="0 0 700 700"
        preserveAspectRatio="xMidYMid meet"
    >

        <!--
            LEFT RIBBON

            Starts under T
            → flies down-left
            → sweeps outside
            → flies upward
            → curves toward center
        -->

        <path
            id="leftRibbon"
            class="ribbon left"
            d="
            M350 470

            C300 500 245 520 185 485

            C115 445 80 365 110 280

            C135 205 205 145 280 150

            C325 153 345 180 350 215
            "
        />

        <!-- RIGHT -->

        <path
            id="rightRibbon"
            class="ribbon right"
            d="
            M350 470

            C400 500 455 520 515 485

            C585 445 620 365 590 280

            C565 205 495 145 420 150

            C375 153 355 180 350 215
            "
        />

        <!-- final heart outline -->

        <path
            id="heart"
            class="heartGlow"
            d="
            M350 215

            C320 165 235 130 175 190

            C95 270 150 390 350 535

            C550 390 605 270 525 190

            C465 130 380 165 350 215
            "
        />

    </svg>

    <div id="particles"></div>

</div>


<script>

/* =====================================================
   STARS
===================================================== */

const stars = document.getElementById("stars");

for (let i = 0; i < 90; i++) {

    const star = document.createElement("div");

    star.className = "star";

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 4 + "s";

    stars.appendChild(star);
}


/* =====================================================
   ELEMENTS
===================================================== */

const button =
    document.getElementById("start");

const letter =
    document.getElementById("letter");

const left =
    document.getElementById("leftRibbon");

const right =
    document.getElementById("rightRibbon");

const heart =
    document.getElementById("heart");

const particles =
    document.getElementById("particles");


let started = false;


/* =====================================================
   DRAW RIBBON
===================================================== */

function preparePath(path) {

    const length =
        path.getTotalLength();

    path.style.strokeDasharray =
        length;

    path.style.strokeDashoffset =
        length;

    return length;
}


/* =====================================================
   CREATE FLOATING PARTICLES
===================================================== */

function createParticles() {

    for (let i = 0; i < 25; i++) {

        const p =
            document.createElement("div");

        p.className =
            "particle";

        p.style.left =
            (25 + Math.random() * 50) + "%";

        p.style.top =
            (25 + Math.random() * 50) + "%";

        particles.appendChild(p);

        setTimeout(() => {

            p.animate(

                [
                    {
                        opacity: 0,
                        transform:
                            "translate(0, 0) scale(.4)"
                    },

                    {
                        opacity: 1,
                        transform:
                            "translate(0, -20px) scale(1)"
                    },

                    {
                        opacity: 0,
                        transform:
                            `translate(
                                ${(Math.random()-.5)*100}px,
                                -${40+Math.random()*60}px
                            )
                            scale(.2)`
                    }
                ],

                {
                    duration:
                        1800 + Math.random()*1800,

                    delay:
                        Math.random()*1000,

                    iterations:
                        Infinity
                }

            );

        }, 100);
    }
}


/* =====================================================
   MAIN ANIMATION
===================================================== */

button.addEventListener("click", () => {

    if (started)
        return;

    started = true;

    /* BUTTON → T */

    button.classList.add("hide");


    setTimeout(() => {

        letter.classList.add("show");

    }, 500);


    /* PREPARE RIBBONS */

    preparePath(left);
    preparePath(right);


    /*
        1.5 sec:
        ribbons appear
    */

    setTimeout(() => {

        left.style.opacity = "1";
        right.style.opacity = "1";

        left.style.transition =
            "stroke-dashoffset 2.8s cubic-bezier(.2,.8,.2,1)";

        right.style.transition =
            "stroke-dashoffset 2.8s cubic-bezier(.2,.8,.2,1)";


        requestAnimationFrame(() => {

            left.style.strokeDashoffset = "0";
            right.style.strokeDashoffset = "0";

        });

    }, 1500);


    /*
        After ribbons fly:
        show final heart.
    */

    setTimeout(() => {

        heart.style.opacity = "1";

        const length =
            heart.getTotalLength();

        heart.style.strokeDasharray =
            length;

        heart.style.strokeDashoffset =
            length;

        heart.style.transition =
            "stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1)";


        requestAnimationFrame(() => {

            heart.style.strokeDashoffset = "0";

        });


        letter.classList.add("float");

        createParticles();

    }, 4000);


    /*
        Hide ribbon paths after
        the heart is established.
    */

    setTimeout(() => {

        left.style.transition =
            "opacity 1s";

        right.style.transition =
            "opacity 1s";

        left.style.opacity = "0";
        right.style.opacity = "0";

        heart.classList.add("heartDone");

    }, 5600);

});

</script>

</body>
</html>
