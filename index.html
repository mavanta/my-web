<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đặc Biệt :></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #1e1b3a, #0a0a1a 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Background stars / particles */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: transparent;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 240, 250, 0.7);
            box-shadow: 0 0 10px #ffb7e6, 0 0 20px #b28aff;
            animation: twinkle 4s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* MAIN STAGE */
        .stage {
            position: relative;
            width: min(90vw, 90vh);
            height: min(90vw, 90vh);
            max-width: 700px;
            max-height: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: all 0.4s ease;
        }

        /* ---------- BUTTON ---------- */
        .start-button {
            position: absolute;
            padding: 1.2rem 3.2rem;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 2px;
            color: #fff0f5;
            background: rgba(255, 150, 200, 0.15);
            border: 1.5px solid rgba(255, 180, 220, 0.7);
            border-radius: 60px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 30px rgba(255, 120, 200, 0.3), 0 0 60px rgba(150, 100, 255, 0.2);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 30;
            text-shadow: 0 0 10px rgba(255, 200, 230, 0.8);
            font-family: inherit;
            white-space: nowrap;
            outline: none;
        }

        .start-button:hover {
            background: rgba(255, 150, 200, 0.3);
            border-color: #ffb0d0;
            box-shadow: 0 0 50px rgba(255, 120, 200, 0.6), 0 0 100px rgba(180, 120, 255, 0.4);
            transform: scale(1.04);
        }

        .start-button:active {
            transform: scale(0.98);
        }

        /* Button transforms into T */
        .start-button.transform-to-T {
            animation: buttonToT 1.2s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
            pointer-events: none;
        }

        @keyframes buttonToT {
            0% {
                opacity: 1;
                transform: scale(1);
                border-radius: 60px;
                padding: 1.2rem 3.2rem;
                font-size: clamp(1.2rem, 4vw, 1.8rem);
                background: rgba(255, 150, 200, 0.15);
                border-color: rgba(255, 180, 220, 0.7);
                color: #fff0f5;
            }
            30% {
                opacity: 0.8;
                transform: scale(1.2);
                border-radius: 50px;
                background: rgba(255, 200, 230, 0.3);
                border-color: #ffc0e0;
                color: #fff5fc;
            }
            70% {
                opacity: 0.6;
                transform: scale(0.9);
                border-radius: 20px;
                background: rgba(255, 220, 240, 0.1);
                border-color: #ffa0d0;
                color: #ffe8f5;
                padding: 0.6rem 1.8rem;
                font-size: clamp(1.5rem, 5vw, 2.2rem);
            }
            100% {
                opacity: 0;
                transform: scale(0.5);
                border-radius: 50%;
                background: transparent;
                border-color: transparent;
                color: transparent;
                padding: 0;
                font-size: 0;
            }
        }

        /* ---------- BIG LETTER T ---------- */
        .big-T {
            position: absolute;
            font-size: clamp(8rem, 30vw, 16rem);
            font-weight: 300;
            color: #ffeef8;
            text-shadow: 0 0 20px #ffb0d0, 0 0 60px #b88aff, 0 0 100px #7a4aff;
            z-index: 25;
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.3, 0.64, 1);
            pointer-events: none;
            line-height: 1;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            letter-spacing: 0;
        }

        .big-T.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* ---------- HEART / WINGS SVG ---------- */
        .heart-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: visible;
            pointer-events: none;
            z-index: 20;
        }

        .wing-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        /* Kích hoạt vẽ */
        .wing-path.draw {
            opacity: 1;
        }

        /* Left and right path styles */
        .wing-left {
            stroke: #ff90c0;
            stroke-width: 6;
            filter: drop-shadow(0 0 12px #ff60b0) drop-shadow(0 0 28px #b060ff);
        }

        .wing-right {
            stroke: #b090ff;
            stroke-width: 6;
            filter: drop-shadow(0 0 12px #a060ff) drop-shadow(0 0 28px #ff80c0);
        }

        /* Idle heart pulse & glow */
        .heart-group {
            animation: heartGlowPulse 3s infinite alternate ease-in-out;
        }

        @keyframes heartGlowPulse {
            0% { filter: drop-shadow(0 0 6px #ff80b0) drop-shadow(0 0 18px #a060ff); }
            100% { filter: drop-shadow(0 0 18px #ff60a0) drop-shadow(0 0 36px #c080ff); }
        }

        /* Sparkles container */
        .sparkles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 26;
            overflow: visible;
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff5fc;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffb0e0, 0 0 24px #b080ff;
            animation: sparkleFloat 2.5s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes sparkleFloat {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            30% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            70% { opacity: 0.8; transform: translateY(-40px) scale(0.9); }
            100% { opacity: 0; transform: translateY(-60px) scale(0.4); }
        }

        /* Floating T effect (idle) */
        .big-T.idle-float {
            animation: floatT 4s infinite alternate ease-in-out;
        }

        @keyframes floatT {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.02) translateY(-8px); }
        }

        /* Responsive tweaks */
        @media (max-width: 480px) {
            .start-button {
                padding: 1rem 2.2rem;
                font-size: 1.1rem;
                letter-spacing: 1px;
            }
            .big-T {
                font-size: clamp(6rem, 28vw, 10rem);
            }
            .wing-left, .wing-right {
                stroke-width: 5;
            }
        }

        /* Hide on complete */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Background stars -->
    <div class="stars" id="stars"></div>

    <!-- Main stage -->
    <div class="stage" id="stage">
        <!-- Nút bấm -->
        <button class="start-button" id="startBtn">Bấm vào đây</button>

        <!-- Chữ T lớn -->
        <div class="big-T" id="bigT">T</div>

        <!-- SVG: hai dải cánh tạo hình trái tim -->
        <svg class="heart-svg" viewBox="0 0 700 700" preserveAspectRatio="xMidYMid meet">
            <g class="heart-group">
                <!-- Left wing path: starts below T, curves out and up to heart left lobe -->
                <path class="wing-path wing-left" id="wingLeft" d="
                    M 350 480
                    C 270 480, 190 430, 160 360
                    C 130 290, 150 210, 210 160
                    C 270 110, 320 140, 350 190
                " />
                <!-- Right wing path: mirrored, starts below T -->
                <path class="wing-path wing-right" id="wingRight" d="
                    M 350 480
                    C 430 480, 510 430, 540 360
                    C 570 290, 550 210, 490 160
                    C 430 110, 380 140, 350 190
                " />
            </g>
        </svg>

        <!-- Sparkles container -->
        <div class="sparkles" id="sparkles"></div>
    </div>

    <script>
        (function() {
            // ---- Tạo background stars ----
            const starsContainer = document.getElementById('stars');
            const starCount = 80;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 4 + 1.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.opacity = Math.random() * 0.6 + 0.2;
                starsContainer.appendChild(star);
            }

            // ---- Lấy các phần tử ----
            const startBtn = document.getElementById('startBtn');
            const bigT = document.getElementById('bigT');
            const wingLeft = document.getElementById('wingLeft');
            const wingRight = document.getElementById('wingRight');
            const sparklesContainer = document.getElementById('sparkles');
            const stage = document.getElementById('stage');

            // ---- Biến trạng thái ----
            let animationStarted = false;

            // ---- Hàm tạo sparkles ngẫu nhiên xung quanh tim ----
            function createSparkles() {
                // Xóa sparkles cũ nếu có
                sparklesContainer.innerHTML = '';
                const sparkleCount = 18;
                const centerX = 350; // trong viewBox SVG 700x700
                const centerY = 350;
                // Tạo tọa độ tương đối dựa trên stage thực tế
                for (let i = 0; i < sparkleCount; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.classList.add('sparkle');
                    // Vị trí ngẫu nhiên quanh khu vực trái tim (bán kính 180-260)
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 150 + Math.random() * 110;
                    const x = 50 + (Math.cos(angle) * radius) / 700 * 100; // phần trăm so với stage
                    const y = 50 + (Math.sin(angle) * radius) / 700 * 100;
                    sparkle.style.left = x + '%';
                    sparkle.style.top = y + '%';
                    sparkle.style.animationDelay = (Math.random() * 2) + 's';
                    sparkle.style.animationDuration = (1.8 + Math.random() * 2) + 's';
                    sparkle.style.width = (Math.random() * 6 + 3) + 'px';
                    sparkle.style.height = sparkle.style.width;
                    sparklesContainer.appendChild(sparkle);
                }
            }

            // ---- Hàm chạy animation chính ----
            function startAnimation() {
                if (animationStarted) return;
                animationStarted = true;

                // 1. Nút biến đổi thành T (animation)
                startBtn.classList.add('transform-to-T');

                // 2. Sau khi nút mờ đi (khoảng 0.6s), hiện chữ T
                setTimeout(() => {
                    bigT.classList.add('visible');
                }, 500);

                // 3. Sau khi chữ T hiện lên ổn định (khoảng 1.2s), bắt đầu vẽ hai cánh
                setTimeout(() => {
                    // Hiện paths (opacity)
                    wingLeft.classList.add('draw');
                    wingRight.classList.add('draw');

                    // Kích thước path length để animate stroke-dashoffset
                    const leftLength = wingLeft.getTotalLength();
                    const rightLength = wingRight.getTotalLength();

                    // Set dash array & offset ban đầu: ẩn hoàn toàn
                    wingLeft.style.strokeDasharray = leftLength;
                    wingLeft.style.strokeDashoffset = leftLength;
                    wingRight.style.strokeDasharray = rightLength;
                    wingRight.style.strokeDashoffset = rightLength;

                    // Force reflow
                    wingLeft.getBoundingClientRect();
                    wingRight.getBoundingClientRect();

                    // Animation: vẽ đường với transition mượt
                    wingLeft.style.transition = 'stroke-dashoffset 2.2s cubic-bezier(0.45, 0.05, 0.2, 1)';
                    wingRight.style.transition = 'stroke-dashoffset 2.2s cubic-bezier(0.45, 0.05, 0.2, 1)';

                    // Bắt đầu vẽ (dashoffset về 0)
                    requestAnimationFrame(() => {
                        wingLeft.style.strokeDashoffset = '0';
                        wingRight.style.strokeDashoffset = '0';
                    });

                    // 4. Tạo sparkles sau khi cánh vẽ xong một chút (sau 1.5s)
                    setTimeout(() => {
                        createSparkles();
                    }, 1500);

                    // 5. Sau khi vẽ xong (2.2s), thêm idle float cho T
                    setTimeout(() => {
                        bigT.classList.add('idle-float');
                        // Thêm pulse cho heart group (đã có sẵn animation)
                    }, 2200);

                }, 1400); // thời điểm bắt đầu vẽ cánh
            }

            // Gắn sự kiện click
            startBtn.addEventListener('click', startAnimation);

            // Dự phòng: nếu sparkles bị trống, tạo sau 4s (để chắc chắn)
            setTimeout(() => {
                if (sparklesContainer.children.length === 0 && animationStarted) {
                    createSparkles();
                }
            }, 6000);

            // Đảm bảo nếu click lần nữa không làm gì
            startBtn.addEventListener('click', (e) => e.preventDefault());

            // Xử lý responsive: khi resize, không cần làm gì thêm vì SVG scale theo stage.

            // Tinh chỉnh nhỏ: căn giữa chữ T và svg theo stage
            // (đã dùng absolute + flex, nhưng svg phủ toàn stage)
            // Đảm bảo stage có kích thước phù hợp.
        })();
    </script>
</body>
</html>
